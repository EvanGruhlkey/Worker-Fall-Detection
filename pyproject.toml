[project]
name = "worker-fall-detection"
version = "0.1.0"
description = "Computer vision safety software to detect worker falls (YOLO Pose + ByteTrack)"
readme = "README.md"
# PyTorch's last macOS x86_64 (Intel) wheels are torch 2.2.2, which supports
# Python 3.8-3.12. Pinning to 3.12 keeps every machine on a version PyTorch
# actually ships wheels for.
requires-python = ">=3.12,<3.13"
dependencies = [
    "ultralytics>=8.3",
    "opencv-python>=4.10",
    "lap>=0.5.12",
    # torch 2.2.2 (the newest build for Intel Macs) was compiled against
    # NumPy 1.x and fails at runtime with NumPy 2.
    "numpy<2; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "fastapi>=0.146.0",
    "uvicorn[standard]>=0.54.0",
    "sqlmodel>=0.0.48",
    "python-multipart>=0.0.32",
    "imageio-ffmpeg>=0.6.0",
    "matplotlib>=3.11.2",
    "psycopg[binary]>=3.2",
    "alembic>=1.16",
    "boto3>=1.40",
    "pixeltable-pgserver>=0.7",
    "rtmlib==0.0.16",
]

[tool.uv]
# This is a collection of scripts, not an installable package.
package = false
# Install one ONNX Runtime package; these packages share a Python module.
default-groups = ["dev", "runtime", "cpu"]
conflicts = [
    [{ group = "runtime" }, { group = "cuda" }],
    # PyTorch: the CPU build (default) or the NVIDIA build (groups cpu / gpu below).
    [{ group = "cpu" }, { group = "gpu" }],
]
# Make the lockfile include a torch/torchvision version that has wheels for
# Intel Macs (torch 2.2.2 / torchvision 0.17.2). Other platforms (Apple
# Silicon, Linux, Windows) still resolve to the newest release.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

# RTMLib declares the CPU runtime unconditionally. Select it ourselves below.
[[tool.uv.dependency-metadata]]
name = "rtmlib"
version = "0.0.16"
requires-dist = ["numpy", "opencv-contrib-python", "opencv-python", "tqdm"]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cu130", group = "gpu", marker = "sys_platform != 'darwin'" }]
torchvision = [{ index = "pytorch-cu130", group = "gpu", marker = "sys_platform != 'darwin'" }]

[dependency-groups]
runtime = [
    "onnxruntime-directml>=1.24.4; sys_platform == 'win32'",
    "onnxruntime>=1.23.2; sys_platform != 'win32'",
]
cuda = ["onnxruntime-gpu>=1.23.2; sys_platform != 'darwin'"]
# PyTorch is only used for training and for pose extraction (scripts/), not by
# the live pipeline (ONNX). "cpu" is the default; on an NVIDIA laptop, extraction
# runs several times faster with the CUDA build:
#   uv run --no-group cpu --group gpu scripts/extract_poses_rtmpose.py ...
# (needs an NVIDIA driver that supports CUDA 13, version 580 or newer).
cpu = ["torch", "torchvision"]
gpu = [
    "torch==2.14.1; sys_platform != 'darwin'",
    "torchvision==0.29.1; sys_platform != 'darwin'",
]
dev = [
    "httpx2>=2.14.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
