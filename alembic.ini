# Alembic settings for the `alembic` command, e.g.
#   uv run alembic revision --autogenerate -m "add camera table"
#   uv run alembic upgrade head
# The database URL comes from .env (see docs/database.md). The backend also
# applies migrations itself on startup.

[alembic]
script_location = src/backend/migrations
prepend_sys_path = src
file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(rev)s_%%(slug)s
